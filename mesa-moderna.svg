<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 768" role="img" aria-label="Ilustración de una mesa moderna junto a una ventana, con radio digital, tableta, mate, vaso y plantas">
<title>Mesa moderna</title>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF1F4"/><stop offset="1" stop-color="#DCE3EA"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9E3F6"/><stop offset="1" stop-color="#F3F8FC"/></linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDBF93"/><stop offset="1" stop-color="#C9A26F"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B98B58"/><stop offset="1" stop-color="#A47749"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".6"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9B0" stop-opacity=".32"/><stop offset="1" stop-color="#FFE9B0" stop-opacity="0"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  <pattern id="mesh" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#4B525D"/><circle cx="4" cy="4" r="1.4" fill="#262B32"/></pattern>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="11" flood-color="#0B1B2E" flood-opacity=".3"/></filter>
  <filter id="sh2" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0B1B2E" flood-opacity=".28"/></filter>
</defs>

<rect width="1408" height="768" fill="url(#wall)"/>

